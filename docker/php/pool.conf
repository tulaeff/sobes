; Перекрывает дефолты из www.conf (файлы в php-fpm.d читаются по алфавиту, zz- идёт последним).
; Причина: каждый ответ суфлёра держит воркер целиком всё время стрима (5-11с),
; поэтому на дефолтных 5 воркерах второй вопрос подряд и разбор скрина вставали в очередь.
; static, а не dynamic: dynamic поднимает воркеры постепенно и на всплеске вопросов
; запрос всё равно ждёт (замер: 1.18с при 8 параллельных). Воркер ест ~14 МБ, 20 штук = ~280 МБ — не жалко.
[www]
pm = static
pm.max_children = 20
pm.max_requests = 500

; выше CURLOPT_TIMEOUT (90с) в anthropicStream — воркер не должен умирать раньше, чем отвалится сам запрос
request_terminate_timeout = 120s
