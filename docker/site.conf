server {
    listen 80;
    server_name _;
    charset utf-8;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # API -> PHP-FPM
    location /api/ {
        include fastcgi_params;
        # запись встречи льётся кусками по несколько МБ; дефолтный 1m рвал бы заливку 413-й
        client_max_body_size 64m;
        fastcgi_pass sobes-php:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/api/index.php;
        fastcgi_param SCRIPT_NAME /api/index.php;
        # выше CURLOPT_TIMEOUT (90с) в php, но ниже request_terminate_timeout (120с) в fpm:
        # при зависании Anthropic первым срабатывает curl и отдаёт внятную ошибку, а не обрыв соединения
        fastcgi_read_timeout 100s;

        # стриминг суфлёра: не копить ответ ни здесь, ни во внешнем прокси.
        # nginx съедает X-Accel-Buffering от php, поэтому отдаём его наружу сами
        fastcgi_buffering off;
        add_header X-Accel-Buffering no always;
    }

    # файлы записей встреч (том ./recordings): отдаёт nginx, а не php — Range для перемотки идёт из коробки
    location /rec/ {
        alias /srv/rec/;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "private, max-age=3600" always;
        try_files $uri =404;
    }

    # версионированные ассеты (?v=N) — кешируем: при правке меняется URL, кеш сам сбрасывается
    location ~* \.(?:js|css|svg|png|jpe?g|gif|ico|woff2?)$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # html/SPA — НЕ кешируем, чтобы правки были видны сразу по обычному F5 (без Cmd+Shift+R)
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}

# Пул keepalive-соединений к Anthropic: TCP+TLS (350-450мс) уходят из горячего пути каждого вопроса.
# Имя резолвится при старте nginx и даёт IPv4 + IPv6, а IPv6-маршрута из docker-сети нет.
# Первый запрос после старта уходит в IPv6, ловит Network unreachable и ретраится на IPv4 (+250мс),
# после чего битый адрес выпадает на сутки. php при полном отказе прокси уходит напрямую сам.
upstream anthropic_api {
    server api.anthropic.com:443 max_fails=1 fail_timeout=86400s;
    keepalive 8;
    keepalive_timeout 300s;
    keepalive_requests 1000;
}

# Отдельный порт, только для php изнутри docker-сети: наружу web портов не публикует,
# а внешний прокси ходит исключительно на :80. На :80 этого location НЕТ намеренно.
server {
    listen 8081;
    server_name _;

    location /anthropic/ {
        proxy_pass https://anthropic_api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host api.anthropic.com;

        # SNI берётся из имени в proxy_pass, а там имя upstream-группы — сервер такой хендшейк рвёт (alert 40)
        proxy_ssl_server_name on;
        proxy_ssl_name api.anthropic.com;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_ssl_session_reuse on;

        # тело запроса буферизуем осознанно: без этого nginx не может повторить POST на следующем адресе
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;

        # ответ не копим — это SSE
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
