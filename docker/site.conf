server {
    listen 80;
    server_name _;
    charset utf-8;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # API -> PHP-FPM
    location /api/ {
        include fastcgi_params;
        fastcgi_pass sobes-php:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/api/index.php;
        fastcgi_param SCRIPT_NAME /api/index.php;
        fastcgi_read_timeout 30s;
    }

    # версионированные ассеты (?v=N) — кешируем: при правке меняется URL, кеш сам сбрасывается
    location ~* \.(?:js|css|svg|png|jpe?g|gif|ico|woff2?)$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # html/SPA — НЕ кешируем, чтобы правки были видны сразу по обычному F5 (без Cmd+Shift+R)
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
