<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0c0d10">
  <title>Шпаргалка PHP · собес</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%237c6cff'/%3E%3Ctext x='16' y='23' font-size='19' text-anchor='middle' fill='white' font-family='monospace' font-weight='bold'%3E%3C?%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css?v=17">
</head>
<body>
  <div id="app">
    <aside id="sidebar" aria-label="Категории">
      <div class="brand">
        <span class="brand-logo">&lt;?</span>
        <div class="brand-text">
          <b>PHP шпаргалка</b>
          <small id="stat-line">загрузка…</small>
        </div>
      </div>
      <div class="personal">
        <button class="pbtn" data-personal="self" type="button">👤 Расскажи о себе</button>
        <button class="pbtn" data-personal="task" type="button">💡 Сложная / интересная задача</button>
      </div>
      <nav id="cats" class="cats"></nav>
      <div class="side-foot">
        <button id="unpinAll" class="foot-btn danger" hidden>Снять все закрепы</button>
        <div class="foot-hints"><kbd>/</kbd> поиск · <kbd>↑</kbd><kbd>↓</kbd> навигация · <kbd>Enter</kbd> подробнее · <kbd>Esc</kbd> сброс</div>
      </div>
    </aside>

    <main id="main">
      <header id="topbar">
        <div class="search-wrap">
          <svg class="search-ic" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="m20 20-3.2-3.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input id="q" type="search" inputmode="search" autocomplete="off" autocorrect="off"
                 spellcheck="false" placeholder="Найти ответ… (изоляция транзакций, ===, Doctrine, outbox)" aria-label="Поиск">
          <button id="clear" class="clear" title="Очистить (Esc)" aria-label="Очистить" hidden>&times;</button>
        </div>
      </header>

      <div id="counter" class="counter"></div>
      <section id="results" class="results"></section>
      <div id="empty" class="empty" hidden>
        <b>Ничего не нашлось</b>
      </div>
    </main>
  </div>

  <div id="modal" class="modal" hidden>
    <div class="modal-backdrop" data-close="1"></div>
    <div class="modal-panel" role="dialog" aria-modal="true">
      <button class="modal-edit" id="modal-edit" type="button" title="Редактировать" aria-label="Редактировать"></button>
      <button class="modal-close" data-close="1" aria-label="Закрыть">&times;</button>
      <h2 id="modal-title"></h2>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <script src="/api.js?v=17"></script>
  <script src="/search.js?v=17"></script>
  <script src="/app.js?v=17"></script>
</body>
</html>
